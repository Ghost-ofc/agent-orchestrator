<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Agent Orchestrator</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/i18n.js" defer></script>
  <script src="/actions.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#project-title" data-i18n="a11y.skip"></a>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="/logo.png" alt="" width="28" height="28"><span class="brand-name">Agent Orchestrator</span></div>
    <ul class="totals" data-i18n-aria="summary.label">
      <li id="sum-running" data-tone="blue"><strong>0</strong><span data-i18n="summary.running"></span></li>
      <li id="sum-waiting" data-tone="amber"><strong>0</strong><span data-i18n="summary.waiting"></span></li>
      <li id="sum-review" data-tone="amber"><strong>0</strong><span data-i18n="summary.review"></span></li>
      <li id="sum-failed" data-tone="red"><strong>0</strong><span data-i18n="summary.failed"></span></li>
      <li id="sum-done" data-tone="green"><strong>0</strong><span data-i18n="summary.done"></span></li>
    </ul>
    <div class="topbar-end">
      <details id="attention" class="attention">
        <summary id="attention-summary"><span data-i18n="attention.title"></span><span id="attention-count" class="pill">0</span></summary>
        <div class="attention-panel">
          <p id="attention-empty" class="empty" data-i18n="attention.empty"></p>
          <ul id="attention-list"></ul>
        </div>
      </details>
      <div id="connection" class="connection" role="status"></div>
      <button id="notification-settings" type="button" data-i18n="notifications.title"></button>
      <button id="pause" type="button" aria-pressed="false"></button>
    </div>
  </header>
  <div class="shell">
    <aside class="rail" data-i18n-aria="rail.label">
      <div class="rail-label"><span data-i18n="rail.projects"></span><span id="project-count" class="pill">0</span></div>
      <button id="new-project" type="button" class="primary" data-i18n="projects.new"></button>
      <label class="archived-toggle choice"><input id="show-archived" type="checkbox"><span data-i18n="projects.showArchived"></span></label>
      <nav id="projects" data-i18n-aria="rail.label"><p class="empty" data-i18n="rail.loading"></p></nav>
      <p id="projects-empty" class="empty" data-i18n="projects.empty" hidden></p>
    <section class="agents-sidebar" data-i18n-aria="agents.label">
      <header class="agents-nav-header"><div><h2 data-i18n="agents.title"></h2><p data-i18n="agents.subtitle"></p></div><span id="agent-count" class="pill">0</span></header>
      <nav id="agent-navigation" data-i18n-aria="agents.listLabel"></nav>
      <p id="agent-navigation-empty" class="empty"></p>
    </section>
      <footer class="rail-footer"><time id="clock"></time><span class="privacy" data-i18n="rail.privacy"></span></footer>
    </aside>
    <main id="main">
      <header class="project-header">
        <h1 id="project-title" tabindex="-1"></h1>
        <p id="project-subtitle" class="muted"></p>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="health" class="health" data-i18n-aria="health.label"></section>
      <div class="toolbar">
        <div class="seg" role="group" data-i18n-aria="view.label">
          <button id="view-canvas" type="button" aria-pressed="true" data-i18n="view.canvas"></button>
          <button id="view-list" type="button" aria-pressed="false" data-i18n="view.list"></button>
        </div>
        <label class="filter-label" for="filter" data-i18n="filter.label"></label>
        <select id="filter">
          <option value="all" data-i18n="filter.all"></option>
          <option value="attention" data-i18n="filter.attention"></option>
          <option value="active" data-i18n="filter.active"></option>
          <option value="review" data-i18n="filter.review"></option>
          <option value="failed" data-i18n="filter.failed"></option>
          <option value="complete" data-i18n="filter.complete"></option>
        </select>
        <button id="manage-project" type="button" data-i18n="projects.manage" hidden></button>
        <button id="new-flow" type="button" class="primary" data-i18n="flow.new" hidden></button>
        <button id="new-plan" type="button" data-i18n="plan.new" hidden></button>
        <span id="refresh-status" class="muted"></span>
      </div>
      <section id="canvas-panel">
        <div class="canvas-wrap">
          <div id="canvas" class="canvas" tabindex="0" role="group" data-i18n-aria="canvas.label" aria-describedby="canvas-help">
            <div id="canvas-world" class="world">
              <svg id="canvas-links" class="links" aria-hidden="true" focusable="false"></svg>
              <div id="canvas-nodes"></div>
            </div>
          </div>
          <div class="canvas-controls" role="group" data-i18n-aria="canvas.controls">
            <button id="zoom-in" type="button" data-i18n-aria="canvas.zoomIn" data-i18n-title="canvas.zoomIn">+</button>
            <button id="zoom-out" type="button" data-i18n-aria="canvas.zoomOut" data-i18n-title="canvas.zoomOut">&minus;</button>
            <button id="zoom-fit" type="button" data-i18n-aria="canvas.fit" data-i18n-title="canvas.fit">&#9635;</button>
          </div>
          <p id="canvas-empty" class="empty canvas-empty" hidden></p>
        </div>
        <p id="canvas-help" class="muted canvas-help" data-i18n="canvas.help"></p>
      </section>
      <section id="list-panel" hidden>
        <div class="table-heading"><h2 id="agents-heading"></h2></div>
        <div class="table-scroll"><table aria-labelledby="agents-heading"><colgroup><col class="agent-col"><col class="model-col"><col class="task-col"><col class="phase-col"><col class="time-col"><col class="state-col"></colgroup><thead><tr><th scope="col" data-i18n="table.agent"></th><th scope="col" data-i18n="table.model"></th><th scope="col" data-i18n="table.task"></th><th scope="col" data-i18n="table.phase"></th><th scope="col" data-i18n="table.elapsed"></th><th scope="col" data-i18n="table.state"></th></tr></thead><tbody id="agents"></tbody></table></div>
        <p id="table-empty" class="empty" hidden></p>
      </section>
    </main>
    <aside class="inspector" data-i18n-aria="inspector.label">
      <header class="inspector-header"><button id="close-inspector" type="button" class="close" data-i18n-aria="inspector.close">&times;</button><div><h2 id="inspector-title"></h2><p id="inspector-subtitle" class="muted"></p></div><button id="show-messages" type="button" data-i18n="inspector.messagesButton"></button></header>
      <div id="actions" class="actions" role="group" data-i18n-aria="actions.label" hidden></div>
      <p id="detail-status" class="muted" role="status"></p>
      <p id="agent-access-info" class="muted access-applied" hidden></p>
      <section id="plans-list" class="plans-list" data-i18n-aria="plan.listLabel" hidden></section>
      <section id="plan-detail" class="plan-detail" data-i18n-aria="plan.detailLabel" hidden></section>
      <div id="agent-sections">
      <div class="tabs" role="tablist" data-i18n-aria="inspector.tabs">
        <button type="button" role="tab" id="tab-messages" aria-controls="panel-messages" aria-selected="true" data-tab="messages" data-i18n="tab.messages"></button>
        <button type="button" role="tab" id="tab-files" aria-controls="panel-files" aria-selected="false" tabindex="-1" data-tab="files" data-i18n="tab.files"></button>
        <button type="button" role="tab" id="tab-tests" aria-controls="panel-tests" aria-selected="false" tabindex="-1" data-tab="tests" data-i18n="tab.tests"></button>
        <button type="button" role="tab" id="tab-usage" aria-controls="panel-usage" aria-selected="false" tabindex="-1" data-tab="usage" data-i18n="tab.usage"></button>
      </div>
      <section id="panel-messages" role="tabpanel" aria-labelledby="tab-messages"><ol id="timeline" class="timeline"></ol></section>
      <section id="panel-files" role="tabpanel" aria-labelledby="tab-files" hidden><div id="files"></div></section>
      <section id="panel-tests" role="tabpanel" aria-labelledby="tab-tests" hidden><div id="tests"></div></section>
      <section id="panel-usage" role="tabpanel" aria-labelledby="tab-usage" hidden><div id="usage"></div></section>
      <section id="questions" data-i18n-aria="question.label"></section>
      <section id="summary" class="summary" data-i18n-aria="summary.agentLabel"></section>
      <section id="history" data-i18n-aria="history.label"></section>
      <details id="local-logs"><summary data-i18n="logs.title"></summary><p class="muted" data-i18n="logs.help"></p><h3 data-i18n="logs.stdout"></h3><pre id="stdout"></pre><h3 data-i18n="logs.stderr"></h3><pre id="stderr"></pre></details>
      </div>
    </aside>
  </div>
  <dialog id="dlg-review" aria-labelledby="dlg-review-title">
    <form id="form-review" class="dialog-form" novalidate>
      <header><h2 id="dlg-review-title" data-i18n="review.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="review.help"></p>
      <fieldset><legend data-i18n="review.verdict"></legend>
        <label class="choice"><input type="radio" name="verdict" value="accepted"><span data-i18n="verdict.accepted"></span></label>
        <label class="choice"><input type="radio" name="verdict" value="repair_required"><span data-i18n="verdict.repair_required"></span></label>
        <label class="choice"><input type="radio" name="verdict" value="rejected"><span data-i18n="verdict.rejected"></span></label>
      </fieldset>
      <label for="review-tests" data-i18n="review.tests"></label>
      <textarea id="review-tests" name="tests" rows="3" maxlength="20000"></textarea>
      <small class="muted" data-i18n="review.testsHelp"></small>
      <label for="review-notes" data-i18n="review.notes"></label>
      <textarea id="review-notes" name="notes" rows="4" maxlength="20000"></textarea>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="review.submit"></button></footer>
    </form>
  </dialog>

  <dialog id="dlg-cancel" aria-labelledby="dlg-cancel-title">
    <form id="form-cancel" class="dialog-form" novalidate>
      <header><h2 id="dlg-cancel-title" data-i18n="cancel.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p data-i18n="cancel.help"></p>
      <label class="choice"><input type="checkbox" name="force"><span data-i18n="cancel.force"></span></label>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.keep"></button><button type="submit" class="danger" data-i18n="cancel.submit"></button></footer>
    </form>
  </dialog>

  <dialog id="dlg-plan" aria-labelledby="dlg-plan-title">
    <form id="form-plan" class="dialog-form wide" novalidate>
      <header><h2 id="dlg-plan-title" data-i18n="plan.createTitle"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="plan.createHelp"></p>
      <label for="plan-title" data-i18n="plan.fieldTitle"></label>
      <input id="plan-title" name="title" type="text" maxlength="200">
      <label for="plan-goal" data-i18n="plan.fieldGoal"></label>
      <textarea id="plan-goal" name="goal" rows="3" maxlength="5000"></textarea>
      <label for="plan-checklist" data-i18n="plan.fieldChecklist"></label>
      <textarea id="plan-checklist" name="checklist" rows="5" maxlength="20000"></textarea>
      <small class="muted" data-i18n="plan.checklistHelp"></small>
      <div class="grid-2">
        <div><label for="plan-strategy" data-i18n="plan.fieldStrategy"></label><select id="plan-strategy" name="strategy"></select></div>
        <div><label for="plan-risk" data-i18n="plan.fieldRisk"></label><select id="plan-risk" name="risk"></select></div>
        <div><label for="plan-type" data-i18n="plan.fieldType"></label><select id="plan-type" name="task_type"></select></div>
        <div><label for="plan-topology" data-i18n="plan.fieldTopology"></label><select id="plan-topology" name="topology"></select></div>
      </div>
      <label for="plan-parallel" data-i18n="plan.fieldParallel"></label>
      <input id="plan-parallel" name="max_parallel" type="number" min="1" max="8" value="3">
      <label for="plan-executors" data-i18n="plan.fieldExecutors"></label>
      <textarea id="plan-executors" name="executors" rows="2" maxlength="2000"></textarea>
      <small class="muted" id="plan-executors-help" data-i18n="plan.executorsHelp"></small>
      <div class="add-executor"><select id="plan-harness" aria-labelledby="plan-executors-help"></select><input id="plan-model" type="text" maxlength="128" data-i18n-aria="plan.modelLabel" data-i18n-placeholder="plan.modelPlaceholder"><button type="button" id="plan-add-executor" data-i18n="plan.addExecutor"></button></div>
      <details>
        <summary data-i18n="plan.advanced"></summary>
        <label for="plan-expensive" data-i18n="plan.fieldExpensive"></label>
        <textarea id="plan-expensive" name="expensive_executors" rows="2" maxlength="1000"></textarea>
        <small class="muted" data-i18n="plan.expensiveHelp"></small>
        <label for="plan-decisions" data-i18n="plan.fieldDecisions"></label>
        <textarea id="plan-decisions" name="decisions" rows="2" maxlength="5000"></textarea>
        <label for="plan-constraints" data-i18n="plan.fieldConstraints"></label>
        <textarea id="plan-constraints" name="constraints" rows="2" maxlength="5000"></textarea>
        <label for="plan-validation" data-i18n="plan.fieldValidation"></label>
        <textarea id="plan-validation" name="validation" rows="2" maxlength="5000"></textarea>
        <label for="plan-completion" data-i18n="plan.fieldCompletion"></label>
        <textarea id="plan-completion" name="completion" rows="2" maxlength="5000"></textarea>
        <small class="muted" data-i18n="plan.defaultsHelp"></small>
      </details>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="plan.submit"></button></footer>
    </form>
  </dialog>

  <dialog id="dlg-launch" aria-labelledby="dlg-launch-title">
    <form id="form-launch" class="dialog-form wide" novalidate>
      <header><h2 id="dlg-launch-title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" id="launch-item"></p>
      <label for="launch-executor" data-i18n="launch.executor"></label>
      <select id="launch-executor" name="executor"></select>
      <small class="muted" id="launch-executor-help"></small>
      <div id="launch-access-group" hidden><label for="launch-access-profile" data-i18n="access.workerProfile"></label><select id="launch-access-profile" name="access_profile"></select><small class="muted" id="launch-access-help"></small></div>
      <label for="launch-task" data-i18n="launch.task"></label>
      <textarea id="launch-task" name="task" rows="14" class="mono" spellcheck="false"></textarea>
      <small class="muted" data-i18n="launch.taskHelp"></small>
      <div class="grid-2">
        <div><label for="launch-role" data-i18n="launch.role"></label><input id="launch-role" name="role" type="text" maxlength="80"></div>
        <div><label for="launch-cost" data-i18n="launch.maxCost"></label><input id="launch-cost" name="max_cost_usd" type="number" min="0.01" step="0.01"></div>
        <div><label for="launch-timeout" data-i18n="launch.timeout"></label><input id="launch-timeout" name="timeout_seconds" type="number" min="30" max="86400" value="3600"></div>
        <div><label for="launch-allow" data-i18n="launch.allowPaths"></label><textarea id="launch-allow" name="allow_paths" rows="2"></textarea></div>
      </div>
      <details>
        <summary data-i18n="launch.advanced"></summary>
        <label for="launch-deny" data-i18n="launch.denyPaths"></label>
        <textarea id="launch-deny" name="deny_paths" rows="2"></textarea>
        <label class="choice"><input type="checkbox" name="allow_dirty"><span data-i18n="launch.allowDirty"></span></label>
        <label class="choice"><input type="checkbox" name="allow_concurrent_workspace"><span data-i18n="launch.allowConcurrent"></span></label>
      </details>
      <label class="choice confirm"><input type="checkbox" name="confirm"><span id="launch-confirm-text"></span></label>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="launch.submit"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-flow" aria-labelledby="dlg-flow-title">
    <form id="form-flow" class="dialog-form wide" novalidate>
      <header><div><small class="eyebrow" data-i18n="flow.eyebrow"></small><h2 id="dlg-flow-title" data-i18n="flow.new"></h2></div><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="flow.help"></p>
      <label for="flow-title" data-i18n="plan.fieldTitle"></label><input id="flow-title" name="title" type="text" maxlength="200" required>
      <label for="flow-goal" data-i18n="flow.goal"></label><textarea id="flow-goal" name="goal" rows="4" maxlength="5000" data-i18n-placeholder="flow.goalPlaceholder" required></textarea>
      <fieldset><legend data-i18n="flow.coordinator"></legend><div class="grid-2">
        <div><label for="flow-cli" data-i18n="flow.harness"></label><select id="flow-cli" name="cli"></select></div>
        <div><label for="flow-model" data-i18n="plan.modelLabel"></label><input id="flow-model" name="model" type="text" list="flow-models" maxlength="128" required><datalist id="flow-models"></datalist></div>
      </div><small class="muted" data-i18n="flow.coordinatorHelp"></small></fieldset>
      <div id="flow-access-group" hidden><label for="flow-access-profile" data-i18n="access.coordinatorProfile"></label><select id="flow-access-profile" name="access_profile"></select><small class="muted" id="flow-access-help"></small></div>
      <label for="flow-tasks" data-i18n="flow.tasks"></label><textarea id="flow-tasks" name="tasks" rows="3" maxlength="10000" data-i18n-placeholder="flow.tasksPlaceholder"></textarea>
      <label for="flow-executors" data-i18n="flow.pool"></label><textarea id="flow-executors" name="executors" rows="2" maxlength="2000" placeholder="claude-code=sonnet&#10;opencode=opencode/deepseek-v4.1-flash-free"></textarea>
      <small class="muted" data-i18n="flow.poolHelp"></small>
      <details><summary data-i18n="plan.advanced"></summary><label for="flow-expensive" data-i18n="plan.fieldExpensive"></label><textarea id="flow-expensive" name="expensive_executors" rows="2" maxlength="1000"></textarea><small class="muted" data-i18n="plan.expensiveHelp"></small></details>
      <div class="grid-2"><div><label for="flow-strategy" data-i18n="plan.fieldStrategy"></label><select id="flow-strategy" name="strategy"></select></div><div><label for="flow-risk" data-i18n="plan.fieldRisk"></label><select id="flow-risk" name="risk"></select></div></div>
      <label class="choice"><input type="checkbox" name="allow_dirty"><span data-i18n="launch.allowDirty"></span></label>
      <label class="choice"><input id="flow-supervise" type="checkbox" name="supervise" checked><span data-i18n="supervision.enable"></span></label>
      <label class="choice"><input id="flow-auto-repair" type="checkbox" name="auto_repair" checked><span data-i18n="supervision.autoRepair"></span></label>
      <small class="muted" data-i18n="supervision.consent"></small>
      <label class="choice confirm"><input type="checkbox" name="confirm"><span data-i18n="flow.confirm"></span></label>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="flow.start"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-coordinator" aria-labelledby="dlg-coordinator-title">
    <form id="form-coordinator" class="dialog-form" novalidate>
      <header><h2 id="dlg-coordinator-title" data-i18n="coordinator.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="coordinator.help"></p>
      <label for="coordinator-cli" data-i18n="flow.harness"></label><select id="coordinator-cli" name="cli"></select>
      <label for="coordinator-model" data-i18n="plan.modelLabel"></label><input id="coordinator-model" name="model" list="coordinator-models" maxlength="128"><datalist id="coordinator-models"></datalist>
      <div id="coordinator-access-group" hidden><label for="coordinator-access-profile" data-i18n="access.coordinatorProfile"></label><select id="coordinator-access-profile" name="access_profile"></select><small id="coordinator-access-help" class="muted"></small></div>
      <label class="choice confirm"><input name="confirm" type="checkbox"><span data-i18n="coordinator.confirm"></span></label>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="projects.save"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-contract" aria-labelledby="dlg-contract-title">
    <form id="form-contract" class="dialog-form wide" novalidate>
      <header><h2 id="dlg-contract-title" data-i18n="contract.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="contract.help"></p>
      <p id="contract-coordinator" class="access-boundary"></p><button id="contract-pick-coordinator" type="button" data-i18n="coordinator.choose"></button>
      <label for="contract-objective" data-i18n="contract.objective"></label><textarea id="contract-objective" name="objective" rows="4" maxlength="5000"></textarea>
      <button id="contract-start" type="button" class="primary" data-i18n="contract.generate"></button>
      <p id="contract-status" class="muted" role="status" aria-live="polite"></p>
      <div id="contract-proposal" hidden>
        <label for="contract-task" data-i18n="planEdit.contract"></label><textarea id="contract-task" name="task" rows="12" maxlength="20000"></textarea>
        <label for="contract-executor" data-i18n="planEdit.executor"></label><select id="contract-executor" name="assigned_executor"></select>
        <label class="choice confirm"><input name="confirm" type="checkbox"><span data-i18n="contract.confirm"></span></label>
      </div>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="contract.save" disabled></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-plan-edit" aria-labelledby="dlg-plan-edit-title">
    <form id="form-plan-edit" class="dialog-form wide" novalidate>
      <header><h2 id="dlg-plan-edit-title" data-i18n="planEdit.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="planEdit.help"></p>
      <label for="plan-edit-title" data-i18n="plan.fieldTitle"></label><input id="plan-edit-title" name="title" maxlength="200" required>
      <label for="plan-edit-goal" data-i18n="plan.fieldGoal"></label><textarea id="plan-edit-goal" name="goal" rows="3" maxlength="5000" required></textarea>
      <details id="plan-edit-executors-details">
        <summary data-i18n="plan.executors"></summary>
        <div class="add-executor">
          <select id="plan-edit-harness"></select>
          <input id="plan-edit-model" type="text" maxlength="128" data-i18n-placeholder="plan.modelPlaceholder">
          <button type="button" id="plan-edit-add-executor" data-i18n="plan.addExecutor"></button>
        </div>
        <ul id="plan-edit-executors-list" class="plan-executors"></ul>
      </details>
      <div id="plan-edit-tasks"></div>
      <button id="plan-edit-add" type="button" data-i18n="planEdit.add"></button>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="projects.save"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-notifications" aria-labelledby="dlg-notifications-title">
    <form id="form-notifications" class="dialog-form" novalidate>
      <header><h2 id="dlg-notifications-title" data-i18n="notifications.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p data-i18n="notifications.help"></p>
      <label for="notification-mode" data-i18n="notifications.mode"></label><select id="notification-mode" name="mode"><option value="important" data-i18n="notifications.important"></option><option value="off" data-i18n="notifications.off"></option><option value="all" data-i18n="notifications.all"></option></select>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="projects.save"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-supervision" aria-labelledby="dlg-supervision-title">
    <form id="form-supervision" class="dialog-form" novalidate>
      <header><h2 id="dlg-supervision-title" data-i18n="supervision.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="supervision.consent"></p>
      <label for="supervision-cli" data-i18n="flow.harness"></label><select id="supervision-cli" name="cli"></select>
      <label for="supervision-model" data-i18n="plan.modelLabel"></label><input id="supervision-model" name="model" list="supervision-models" maxlength="128"><datalist id="supervision-models"></datalist>
      <div id="supervision-access-group" hidden><label for="supervision-access-profile" data-i18n="access.coordinatorProfile"></label><select id="supervision-access-profile" name="access_profile"></select><small id="supervision-access-help" class="muted"></small></div>
      <label class="choice"><input type="checkbox" name="auto_repair"><span data-i18n="supervision.autoRepair"></span></label>
      <label class="choice confirm"><input type="checkbox" name="confirm"><span data-i18n="supervision.confirm"></span></label>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="supervision.start"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-proposal" aria-labelledby="dlg-proposal-title">
    <form id="form-proposal" class="dialog-form wide" novalidate>
      <header><h2 id="dlg-proposal-title" data-i18n="flow.proposal"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="flow.proposalHelp"></p><div id="proposal-tasks"></div>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="flow.accept"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-project" aria-labelledby="dlg-project-title">
    <form id="form-project" class="dialog-form" novalidate>
      <header><h2 id="dlg-project-title" data-i18n="projects.new"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="projects.newHelp"></p>
      <label for="project-name" data-i18n="projects.name"></label><input id="project-name" name="name" type="text" maxlength="100" required>
      <label for="project-mode" data-i18n="projects.mode"></label><select id="project-mode" name="mode"><option value="new" data-i18n="projects.modeNew"></option><option value="existing" data-i18n="projects.modeExisting"></option></select>
      <label for="project-workspace" data-i18n="projects.folder"></label><div class="folder-picker-row"><input id="project-workspace" name="workspace" type="text" maxlength="2000" placeholder="~/Proyectos/mi-app" required><button id="project-pick-folder" type="button" data-i18n="projects.pickParent"></button></div>
      <div id="project-folder-name-group"><label for="project-folder-name" data-i18n="projects.folderName"></label><input id="project-folder-name" name="folder_name" type="text" maxlength="100" placeholder="mi-app"><small class="muted" data-i18n="projects.folderNameHelp"></small></div>
      <p id="project-picker-status" class="muted" role="status" aria-live="polite"></p>
      <small class="muted" data-i18n="projects.folderHelp"></small>
      <label id="project-git-choice" class="choice"><input name="init_git" type="checkbox" checked><span data-i18n="projects.initGit"></span></label>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="projects.add"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-project-manage" aria-labelledby="dlg-project-manage-title">
    <form id="form-project-manage" class="dialog-form" novalidate>
      <header><h2 id="dlg-project-manage-title" data-i18n="projects.manage"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p id="manage-project-folder" class="muted project-folder"></p>
      <button id="project-access-settings" type="button" data-i18n="access.title"></button>
      <label for="manage-project-name" data-i18n="projects.name"></label><input id="manage-project-name" name="name" type="text" maxlength="100" required>
      <label for="manage-project-action" data-i18n="projects.action"></label><select id="manage-project-action" name="action"></select>
      <p id="manage-project-help" class="muted"></p>
      <label id="manage-project-confirm" class="choice confirm" hidden><input name="confirm" type="checkbox"><span data-i18n="projects.deleteConfirm"></span></label>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="projects.save"></button></footer>
    </form>
  </dialog>
  <dialog id="dlg-access" aria-labelledby="dlg-access-title">
    <form id="form-access" class="dialog-form wide" novalidate>
      <header><h2 id="dlg-access-title" data-i18n="access.title"></h2><button type="button" class="close" data-close data-i18n-aria="dialog.close">&times;</button></header>
      <p class="muted" data-i18n="access.help"></p>
      <label class="choice"><input id="access-enabled" name="enabled" type="checkbox"><span data-i18n="access.enabled"></span></label>
      <p class="access-boundary muted" data-i18n="access.boundary"></p>
      <fieldset id="access-resources"><legend data-i18n="access.resources"></legend>
        <h3 data-i18n="access.mcp"></h3><p class="muted" data-i18n="access.mcpHelp"></p><div id="access-mcp-list"></div>
        <h3 data-i18n="access.ssh"></h3><p class="muted" data-i18n="access.sshHelp"></p>
        <div class="ssh-import">
          <div class="plans-head"><h3 data-i18n="access.sshConfig"></h3><button id="access-refresh-ssh" type="button" data-i18n="access.refreshSsh"></button></div>
          <p id="access-ssh-summary" class="muted"></p><div id="access-ssh-warnings" class="muted"></div>
          <label for="access-ssh-search" data-i18n="access.searchInventory"></label><input id="access-ssh-search" type="search">
          <label for="access-import-host" data-i18n="access.detectedHost"></label><select id="access-import-host"></select>
          <label for="access-import-key" data-i18n="access.detectedKey"></label><select id="access-import-key"></select>
          <p id="access-import-detail" class="muted"></p><button id="access-import-ssh" type="button" data-i18n="access.useSsh"></button>
          <details><summary data-i18n="access.organize"></summary>
            <p class="muted" data-i18n="access.organizationHelp"></p>
            <div class="grid-2"><div><label for="access-host-group" data-i18n="access.group"></label><input id="access-host-group" maxlength="80" list="access-known-groups"><datalist id="access-known-groups"></datalist></div>
            <div><label for="access-host-environment" data-i18n="access.environment"></label><select id="access-host-environment"><option value="unknown" data-i18n="access.env.unknown"></option><option value="development" data-i18n="access.env.development"></option><option value="testing" data-i18n="access.env.testing"></option><option value="production" data-i18n="access.env.production"></option></select></div></div>
            <button id="access-save-organization" type="button" data-i18n="access.saveOrganization"></button><p id="access-organization-status" role="status" class="muted"></p>
          </details>
          <details><summary data-i18n="access.keyInventory"></summary><ul id="access-key-inventory"></ul></details>
        </div>
        <ul id="access-ssh-list"></ul>
        <div class="grid-2">
          <div><label for="access-host-name" data-i18n="access.alias"></label><input id="access-host-name" type="text" placeholder="staging" maxlength="64"></div>
          <div><label for="access-host-address" data-i18n="access.host"></label><input id="access-host-address" type="text" placeholder="staging.example.com" maxlength="253"></div>
          <div><label for="access-host-user" data-i18n="access.user"></label><input id="access-host-user" type="text" placeholder="deploy" maxlength="64"></div>
          <div><label for="access-host-port" data-i18n="access.port"></label><input id="access-host-port" type="number" min="1" max="65535" value="22"></div>
        </div>
        <label for="access-host-key" data-i18n="access.key"></label><input id="access-host-key" type="text" placeholder="~/.ssh/id_ed25519" maxlength="2000">
        <button id="access-add-host" type="button" data-i18n="access.addHost"></button>
        <label class="choice"><input id="access-per-agent" type="checkbox"><span data-i18n="access.perAgent"></span></label><p class="muted" data-i18n="access.perAgentHelp"></p>
        <section id="access-profile-fields" class="access-profiles"><h3 data-i18n="access.profiles"></h3><p class="muted" data-i18n="access.profilesHelp"></p>
          <ul id="access-profile-list"></ul>
          <label for="access-profile-name" data-i18n="access.profileName"></label><input id="access-profile-name" type="text" maxlength="64" placeholder="backend">
          <h4 data-i18n="access.profileMcp"></h4><div id="access-profile-mcp"></div>
          <h4 data-i18n="access.profileSsh"></h4><div id="access-profile-ssh"></div>
          <button id="access-add-profile" type="button" data-i18n="access.addProfile"></button>
        </section>
      </fieldset>
      <div class="form-error" role="alert"></div>
      <footer><button type="button" data-close data-i18n="dialog.cancel"></button><button type="submit" class="primary" data-i18n="access.save"></button></footer>
    </form>
  </dialog>
</body>
</html>
